<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Cofre Misterioso</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='./styles/style.css'>
</head>
<body>
    <h1>Escolha o cofre premiado!</h1>
    <h3>Tente sua sorte! Escolha um cofre e clique no botão, veja seu resultado na frase
        que aparecerá.
    </h3>
    <div class="espace" id="espace">
        <button id="cofre1">Cofre 1</button>
        <button id="cofre2">Cofre 2</button>
        <button id="cofre3">Cofre 3</button>
        <button id="novamente">Jogar Novamente 😞</button>
        <div class="recado" id="recado"></div>
    </div>
    <div class="emoji" id="emoji">
        <h1>🏆   🏆   🏆</h1>
    </div>
    <p>Tentativas: <span id="tentativas">0</span></p>
    <p>Vitórias: <span id="vitorias">0</span></p>
    <script src='./js/index.js'></script>
</body>
</html>
